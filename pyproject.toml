[project]
name = "edgub"
version = "0.1.0"
description = "A debugger whose repair policy is one authored expression"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["edgub"]
