[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgub"
version = "0.2.0"
description = "Repair a repository from its own failing tests. No model, no key, no network."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "devkancheti4-design"}]
keywords = ["debugging", "program-repair", "testing", "pytest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
edgub = "edgub.__main__:main"

[project.urls]
Homepage = "https://github.com/devkancheti4-design/edgub"

[tool.setuptools]
packages = ["edgub"]
